# ==========================================
# Playwright CI Build Pipeline
# Author  : Shahid Aftab
# Purpose : Continuous Integration Build (QA - Chrome)
# ==========================================

trigger:
- main

pr:
- main

pool:
  name: 'AutomationPool-20-07-26'

variables:
  NodeVersion: '24'

steps:

# ==========================================
# Checkout Source Code
# ==========================================

- checkout: self
  clean: true

# ==========================================
# Install Node.js
# ==========================================

- task: UseNode@1
  displayName: 'Install Node.js'

  inputs:
    version: $(NodeVersion)

# ==========================================
# Verify Node & NPM Version
# ==========================================

- script: |
    node --version
    npm --version
  displayName: 'Verify Node & NPM Version'

# ==========================================
# Restore NPM Cache
# ==========================================

- task: Cache@2
  displayName: 'Restore NPM Cache'

  inputs:
    key: 'npm | "$(Agent.OS)" | package-lock.json'
    restoreKeys: |
      npm | "$(Agent.OS)"
    path: $(Pipeline.Workspace)/.npm

# ==========================================
# Install Dependencies
# ==========================================

- script: |
    npm ci --cache $(Pipeline.Workspace)/.npm
  displayName: 'Install NPM Packages'

# ==========================================
# Install Playwright Browsers
# ==========================================

- script: |
    npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

# ==========================================
# Execute Playwright Tests
# ==========================================

- script: |
    npx playwright test tests/Login.spec.js \
    --project=chromium \
    --workers=1
  displayName: 'Execute QA Chrome Tests'

  env:
    USERNAME: $(QA_USERNAME)
    PASSWORD: $(QA_PASSWORD)

# ==========================================
# Publish JUnit Results
# ==========================================

- task: PublishTestResults@2
  displayName: 'Publish JUnit Results'

  condition: always()

  inputs:
    testResultsFormat: JUnit
    testResultsFiles: 'artifacts/junit/*.xml'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'Playwright CI Build'

# ==========================================
# Publish HTML Reports
# ==========================================

- task: PublishPipelineArtifact@1
  displayName: 'Publish HTML Reports'

  condition: always()

  inputs:
    targetPath: '$(Build.SourcesDirectory)/reports'
    artifact: Reports

# ==========================================
# Publish Framework Artifacts
# ==========================================

- task: PublishPipelineArtifact@1
  displayName: 'Publish Framework Artifacts'

  condition: always()

  inputs:
    targetPath: '$(Build.SourcesDirectory)/artifacts'
    artifact: Framework-Artifacts